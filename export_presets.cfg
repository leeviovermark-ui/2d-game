[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="shared/*.json"
exclude_filter="server/*,tests/*,scripts/*,artifacts/*,.tools/*,.venv/*,data/*,README.md,docs/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
custom_template/debug="res://.tools/export_templates/4.6.3.stable/web_debug.zip"
custom_template/release="res://.tools/export_templates/4.6.3.stable/web_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>html,body{background:#102025 !important}#status{background:#102025;color:#d9be82}#status-progress{accent-color:#b8c8a4}</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
